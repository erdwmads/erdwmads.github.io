name: Deploy Astro compatibility site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # configure-pages reads the Pages site configuration.
      pages: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: spacecraft-model-simplify.test.mjs reads the unmodified NASA GLB from a past commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure Pages
        uses: actions/configure-pages@v6
      # Every Node unit test (scripts/*.test.mjs and src/**/*.test.mjs); none needs dist/ or a browser.
      - name: Run unit tests
        run: npm run test:unit
      - name: Build site
        run: npm run build
      - name: Export PPT data
        run: npm run export:ppt-data
      - name: Check generated site
        run: npm run check:site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Since v4 dotfiles are skipped by default; keep public/.nojekyll in the artifact as before.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
